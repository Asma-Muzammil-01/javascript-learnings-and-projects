<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const cookies = [
            "chocolate chip", 
            "oatmeal", 
            "sugar cookies",
            "butter cookies"
        ];

        //Helps add something not added before to the array
        cookies.push("peanut butter");

        //Removing last element from the array
        let removedCookie = cookies.pop();
        console.log(removedCookie);

        //Accessing an element of the array
        console.log(cookies[1]);
    </script>
</body>
</html>
