<body>
    <h1>Palindrome Checker</h1>
    <input id="input" type="text" placeholder="Type something"/> 
    <button onclick="check()">Check</button>
    <script src="index.js"></script>
    <!-- Palindrome Checker is a simple web application that allows users to input a string and check if it is a palindrome. A palindrome is a word, phrase, number, or other sequence of characters that reads the same forward and backward (ignoring spaces, punctuation, and capitalization). -->
